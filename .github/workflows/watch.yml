name: 新品監控

on:
  schedule:
    # GitHub Actions 排程最小間隔是 5 分鐘，且系統忙碌時可能會延遲，
    # 不保證每次都準時觸發，屬正常現象。
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # 允許在 GitHub 網頁上手動點擊執行，方便測試

permissions:
  contents: write  # 需要這個權限才能把最新的商品記錄 commit 回這個 repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: |
          pip install -r requirements.txt

      - name: 安裝 Playwright 瀏覽器引擎
        run: |
          python -m playwright install --with-deps chromium

      - name: 執行監控腳本
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python watcher.py

      - name: 把最新的商品記錄存回 repo
        run: |
          git config user.name "funbox-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          # 如果這次執行沒有任何變化（沒有新商品、狀態沒變），就不用 commit
          if git diff --staged --quiet; then
            echo "沒有變化，不需要 commit"
          else
            git commit -m "更新商品監控記錄 [skip ci]"
            # push 有可能因為同時間有其他 commit（例如手動編輯過 state 檔案）而衝突，
            # 這裡加上重試機制：失敗就先同步最新版本再重推，最多試 5 次
            for i in 1 2 3 4 5; do
              if git push; then
                echo "push 成功"
                break
              fi
              echo "push 失敗，嘗試同步最新版本後重試（第 $i 次）"
              git pull --rebase origin main
            done
          fi
